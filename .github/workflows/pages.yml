name: Public guide

on:
  pull_request:
    paths:
      - 'site/**'
      - 'README*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'Cargo.toml'
      - 'scripts/check-public-docs.py'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'Cargo.toml'
      - 'scripts/check-public-docs.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate public documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check public links and markup
        run: python scripts/check-public-docs.py
      - name: Upload the public site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the public site
        id: deployment
        uses: actions/deploy-pages@v4
