[package]
name = "jaso-nfc"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Low-overhead, event-driven NFC filename normalization for macOS"
repository = "https://github.com/garlicvread/jaso-nfc"

[lib]
path = "native/src/lib.rs"

[[bin]]
name = "jaso-nfc"
path = "native/src/main.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
index = []
normalizer = []
platform = []
runtime = ["index", "normalizer", "platform"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
flate2 = "1"
libc = "0.2"
rusqlite = "0.40.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
